<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест на совместимость 🔍</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Marck+Script&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-layer" id="bg-cool"></div>
    <div class="bg-layer" id="bg-warm"></div>
    <canvas id="particles"></canvas>

    <!-- АУДИО -->
    <audio id="audio-test" loop><source src="music_test.mp3" type="audio/mpeg"></audio>
    <audio id="audio-love" loop><source src="music_love.mp3" type="audio/mpeg"></audio>
    <audio id="audio-voice"><source src="voice.mp3" type="audio/mpeg"></audio>
    <audio id="audio-voice-yes"><source src="voice_yes.mp3" type="audio/mpeg"></audio>

    <main class="card" id="card">
        <!-- ЭКРАН 1: ТЕСТ -->
        <div id="screen-test" class="screen active">
            <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
            <h2 id="q-counter">Вопрос 1 из 3</h2>
            <h1 id="q-text">Загрузка...</h1>
            
            <!-- Контейнер для кнопок -->
            <div id="answers" class="buttons"></div>
            
            <!-- Поле для своего варианта ответа -->
            <div id="custom-answer-container" style="display: none; margin-top: 15px; width: 100%;">
                <input type="text" id="custom-answer-input" placeholder="Напиши свой вариант..." style="width: 100%; padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-family: inherit; font-size: 16px; outline: none;">
                <button id="custom-answer-submit" style="margin-top: 10px; padding: 10px 20px; border-radius: 50px; border: none; background: #ff4d6d; color: white; font-weight: bold; cursor: pointer; width: 100%;">Отправить</button>
            </div>
        </div>

        <!-- ЭКРАН 2: ПРИЗНАНИЕ -->
        <div id="screen-love" class="screen">
            <div class="icon" id="main-icon" style="font-size: 0; transition: font-size 0.5s;">💖</div>
            <h1 id="question">Ты будешь моей девушкой?</h1>

            <div class="buttons" id="buttons">
                <button id="yes-btn" class="btn yes">Да! 💕</button>
                <button id="no-btn" class="btn no">Нет</button>
            </div>
            
            <!-- ФИНАЛЬНЫЙ ЭКРАН (появляется после ДА) -->
            <div id="final-screen" style="display: none; margin-top: 20px;">
                <!-- Стих -->
                <div id="poem-container" style="font-size: 18px; font-family: Comfortaa; color: #4a2c4a; line-height: 1.8; margin-bottom: 20px;"></div>
                
                <!-- Фото -->
                <img id="memory-photo" src="" alt="Наше фото" style="display: none; width: 100%; max-height: 300px; object-fit: cover; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 20px; border: 3px solid white;">
                
                <!-- Красивый блок с календарем -->
                <div id="date-picker-container" style="display: none; background: rgba(255,255,255,0.4); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.6);">
                    <h3 style="font-family: Comfortaa; color: #4a2c4a; font-size: 16px; margin-bottom: 15px;">Когда мы пойдем на свидание?</h3>
                    
                    <!-- Выбор даты -->
                    <input type="date" id="date-input" style="width: 100%; padding: 12px; border-radius: 10px; border: none; font-family: inherit; font-size: 16px; margin-bottom: 10px; outline: none; background: white; color: #333;">
                    
                    <!-- Выбор времени (появляется после даты) -->
                    <div id="time-wrapper" style="display: none; width: 100%;">
                        <input type="time" id="time-input" style="width: 100%; padding: 12px; border-radius: 10px; border: none; font-family: inherit; font-size: 16px; margin-bottom: 15px; outline: none; background: white; color: #333;">
                        <button id="confirm-date-btn" class="btn yes" style="width: 100%; padding: 12px; font-size: 16px; background: #ff4d6d;">Подтвердить 📅</button>
                    </div>
                </div>
            </div>
            
            <p id="message" class="message"></p>
        </div>
    </main>

    <button id="music-toggle" class="music-toggle" title="Включить музыку">🎵</button>
    
    <script src="script.js"></script>
</body>
</html>
